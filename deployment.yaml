apiVersion: v1
kind: ServiceAccount
metadata:
  name: ferron-ingress-poc
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ferron-ingress-poc
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ferron-ingress-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ferron-ingress-poc
subjects:
  - kind: ServiceAccount
    name: ferron-ingress-poc
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferron-ingress-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ferron-ingress-poc
  template:
    metadata:
      labels:
        app: ferron-ingress-poc
    spec:
      serviceAccountName: ferron-ingress-poc
      containers:
        - name: controller
          image: dorianniemiec/ferron-ingress-poc:latest
          ports:
            - containerPort: 80
